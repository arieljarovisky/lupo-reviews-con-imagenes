<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderación · Lupo Reviews</title><style>body{margin:0;background:#f4f6f7;color:#101418;font:14px Arial,sans-serif}.app{max-width:1100px;margin:auto;padding:40px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{font-size:32px}input,button{padding:12px;border:1px solid #ccd2d5;border-radius:9px}button{border:0;background:#101418;color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;gap:12px}.card{display:grid;grid-template-columns:1fr auto;gap:20px;padding:20px;background:#fff;border:1px solid #e1e5e7;border-radius:14px}.stars{color:#29abe2}.photos{display:flex;gap:6px;margin-top:10px}.photos img{width:80px;height:80px;object-fit:cover;border-radius:8px}.actions{display:flex;align-items:center;gap:8px}.approve{background:#078ac3}.reject{background:#b3261e}.meta{color:#70787d;font-size:12px}@media(max-width:700px){header,.card{display:grid}.actions{margin-top:10px}}</style></head><body><main class="app"><header><div><small>LUPO ARGENTINA</small><h1>Moderación de reseñas</h1></div><div><input id="token" type="password" placeholder="Token de administrador"><button id="load">Ingresar</button></div></header><section id="reviews" class="grid"></section></main><script>var API='';var token=document.getElementById('token'),box=document.getElementById('reviews');document.getElementById('load').onclick=load;function safe(v){var d=document.createElement('div');d.textContent=v||'';return d.innerHTML}function load(){fetch(API+'/api/admin/reviews',{headers:{Authorization:'Bearer '+token.value}}).then(function(r){if(!r.ok)throw Error('Token incorrecto');return r.json()}).then(render).catch(function(e){box.textContent=e.message})}function render(rows){box.innerHTML=rows.map(function(r){return'<article class="card"><div><div class="stars">'+'★'.repeat(r.rating)+'☆'.repeat(5-r.rating)+'</div><h3>'+safe(r.product_name)+'</h3><strong>'+safe(r.customer_name)+'</strong> · <span class="meta">'+safe(r.customer_email)+' · '+safe(r.status)+'</span><p>'+safe(r.comment)+'</p>'+(r.image_urls.length?'<div class="photos">'+r.image_urls.map(function(x){return'<a href="'+x+'" target="_blank"><img src="'+x+'"></a>'}).join('')+'</div>':'')+'</div><div class="actions"><button class="approve" onclick="setStatus(\''+r.id+'\',\'approved\')">Aprobar</button><button class="reject" onclick="setStatus(\''+r.id+'\',\'rejected\')">Rechazar</button></div></article>'}).join('')||'No hay reseñas.'}function setStatus(id,status){fetch(API+'/api/admin/reviews/'+id,{method:'PATCH',headers:{Authorization:'Bearer '+token.value,'Content-Type':'application/json'},body:JSON.stringify({status:status})}).then(load)}</script></body></html>
